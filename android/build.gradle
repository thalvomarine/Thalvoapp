// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.2'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

/**
 * Capacitor / Capgo / community plugins often ship `src/main/res/.gitkeep`.
 * AGP 8+/9 treats that as a file-based resource with an empty/invalid name
 * (error: "' ' is not a valid file-based resource name character").
 * Strip illegal res filenames in every Android library before resource merge.
 */
subprojects { sub ->
    sub.tasks.configureEach { task ->
        if (task.name.contains("merge") && task.name.toLowerCase().contains("resource")) {
            task.doFirst {
                def resDir = sub.file("src/main/res")
                if (!resDir.exists()) return
                resDir.eachFileRecurse { f ->
                    if (!f.isFile()) return
                    def name = f.name
                    def base = name.contains(".") ? name.substring(0, name.lastIndexOf(".")) : name
                    if (name == ".gitkeep" || !(base ==~ /^[a-z0-9_]+$/)) {
                        f.delete()
                        logger.lifecycle("[thalvo] removed invalid Android res file ${f}")
                    }
                }
            }
        }
    }
}
